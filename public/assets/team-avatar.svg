<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F24" />
      <stop offset="50%" stop-color="#121838" />
      <stop offset="100%" stop-color="#1A153D" />
    </linearGradient>

    <!-- Electric Neon Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Main Shield Outer Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="40%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Inner Core Cyan Glow -->
    <linearGradient id="cyanCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Amber Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7C3AED" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Canvas with Rim -->
  <rect width="120" height="120" rx="32" fill="url(#bgGrad)" filter="url(#shadowFilter)" />
  <rect x="2" y="2" width="116" height="116" rx="30" stroke="url(#rimGrad)" stroke-width="2" stroke-opacity="0.8" />

  <!-- Subtle Cyber Tech Grid in Background -->
  <path d="M25 60H95M60 25V95" stroke="#6366F1" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="60" cy="60" r="38" stroke="#38BDF8" stroke-opacity="0.1" stroke-width="1" />

  <!-- Left Vanguard Wing -->
  <path d="M30 38L52 28V68L30 84V38Z" fill="url(#shieldGrad)" fill-opacity="0.9" />
  <!-- Left Wing Highlight -->
  <path d="M34 42L48 34V64L34 75V42Z" fill="white" fill-opacity="0.15" />

  <!-- Right Vanguard Wing -->
  <path d="M90 38L68 28V68L90 84V38Z" fill="url(#shieldGrad)" fill-opacity="0.9" />
  <!-- Right Wing Highlight -->
  <path d="M86 42L72 34V64L86 75V42Z" fill="white" fill-opacity="0.15" />

  <!-- Center Geometric Shield / Energy Node -->
  <path d="M60 24L74 38L60 96L46 38L60 24Z" fill="url(#rimGrad)" />
  <path d="M60 30L70 41L60 86L50 41L60 30Z" fill="url(#cyanCore)" />

  <!-- Inner Tech Core Diamond -->
  <polygon points="60,42 67,52 60,64 53,52" fill="#FFFFFF" />
  <polygon points="60,46 64,52 60,60 56,52" fill="url(#sparkGrad)" />

  <!-- Bottom Cyber Crest Accent -->
  <path d="M52 86L60 94L68 86" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="60" cy="98" r="2.5" fill="#38BDF8" />

  <!-- Top Apex Star Pip -->
  <circle cx="60" cy="18" r="2" fill="#FDE047" />
</svg>
